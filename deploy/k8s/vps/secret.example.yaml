# Copy to secret.yaml (gitignored — never commit real values) per VPS,
# fill in, and apply with each VPS's own kubeconfig. No app secret is
# needed (stateless, no database, no Access) — only cloudflared's tunnel
# token.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared
  namespace: onlinepresence-app
type: Opaque
stringData:
  # terraform output -raw onlinepresence_vps_tunnel_token in baldwinsung_cloudflare/zerotrust
  # Same token on all 3 VPS — this is what makes them 3 replicas of one
  # tunnel rather than 3 separate tunnels.
  tunnel-token: "changeme"
